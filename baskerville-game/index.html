<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>巴斯克维尔猎犬 - 侦探推理游戏</title>
<style>
/* ===== RESET & BASE ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F5F5DC;--ink:#2F2F2F;--brown:#8B4513;--green:#2E8B57;--red:#B22222;--muted:#555;
  --card-pad:24px;--gap:20px;--radius:2px;
  --font-heading:Georgia,'Times New Roman',serif;
  --font-body:'Merriweather',Georgia,'Times New Roman',serif;
  --transition:250ms ease-in-out;
}
html{font-size:15px;line-height:1.6}
body{
  font-family:var(--font-body);color:var(--ink);background:var(--bg);
  min-height:100vh;overflow-x:hidden;
  background-image:
    radial-gradient(ellipse at 20% 50%,rgba(139,69,19,.04) 0%,transparent 50%),
    radial-gradient(ellipse at 80% 20%,rgba(139,69,19,.03) 0%,transparent 50%);
}
/* paper texture overlay */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;
  background-image:url("data:image/svg+xml,%3Csvg width='200' height='200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence baseFrequency='.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.03'/%3E%3C/svg%3E");
}

/* ===== TYPOGRAPHY ===== */
h1,h2,h3,h4{font-family:var(--font-heading);font-weight:600;color:var(--brown)}
h1{font-size:2rem}h2{font-size:1.5rem}h3{font-size:1.2rem}h4{font-size:1.05rem}
.muted{color:var(--muted)}
a{color:var(--brown);text-decoration:none}

/* ===== LAYOUT ===== */
.container{max-width:900px;margin:0 auto;padding:16px}
.view{display:none;animation:slideIn var(--transition) both}
.view.active{display:block}

/* ===== ANIMATIONS ===== */
@keyframes slideIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes stampIn{0%{transform:scale(2) rotate(-15deg);opacity:0}60%{transform:scale(.95) rotate(2deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes flipIn{0%{transform:perspective(800px) rotateY(90deg);opacity:0}100%{transform:perspective(800px) rotateY(0);opacity:1}}
@keyframes inkSpread{0%{box-shadow:0 0 0 0 rgba(139,69,19,.3)}100%{box-shadow:0 0 0 6px rgba(139,69,19,0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes writeLine{from{width:0}to{width:100%}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}

/* ===== BUTTONS ===== */
.btn{
  display:inline-block;padding:10px 20px;border:2px solid var(--brown);
  background:transparent;color:var(--brown);font-family:var(--font-heading);
  font-size:.95rem;cursor:pointer;border-radius:var(--radius);
  transition:all var(--transition);position:relative;overflow:hidden;
}
.btn:hover{background:var(--brown);color:var(--bg);animation:inkSpread .4s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--brown);color:var(--bg)}
.btn.primary:hover{background:#6B3410}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.danger:hover{background:var(--red);color:#fff}
.btn.success{border-color:var(--green);color:var(--green)}
.btn.success:hover{background:var(--green);color:#fff}
.btn.small{padding:6px 12px;font-size:.85rem}
.btn:disabled{opacity:.4;cursor:not-allowed;pointer-events:none}

/* ===== CARDS ===== */
.card{
  background:#FFFEF7;border:1px solid rgba(139,69,19,.2);
  border-radius:var(--radius);padding:var(--card-pad);
  margin-bottom:var(--gap);position:relative;
  box-shadow:1px 2px 6px rgba(0,0,0,.06);
  transition:all var(--transition);
}
.card:hover{box-shadow:2px 4px 12px rgba(0,0,0,.1)}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--brown),transparent);border-radius:var(--radius) var(--radius) 0 0;
}

/* ===== BADGE ===== */
.badge{
  display:inline-block;padding:2px 8px;font-size:.75rem;border-radius:var(--radius);
  font-family:var(--font-heading);margin-left:6px;vertical-align:middle;
}
.badge.phase1{background:rgba(139,69,19,.15);color:var(--brown)}
.badge.phase2{background:rgba(46,139,87,.15);color:var(--green)}
.badge.phase3{background:rgba(178,34,34,.15);color:var(--red)}
.badge.hidden-badge{background:rgba(85,85,85,.15);color:var(--muted)}
.badge.key{background:rgba(139,69,19,.25);color:var(--brown);font-weight:600}

/* ===== START SCREEN ===== */
#startScreen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  text-align:center;
}
#startScreen .card{max-width:560px;padding:40px;margin:auto}
#startScreen h1{font-size:2.4rem;margin-bottom:8px;letter-spacing:2px}
#startScreen .subtitle{font-size:1rem;color:var(--muted);margin-bottom:24px;font-style:italic}
#startScreen .briefing{
  text-align:left;margin:24px 0;padding:16px;
  border-left:3px solid var(--brown);background:rgba(139,69,19,.04);
  font-size:.95rem;line-height:1.8;
}
#startScreen .stamp{
  display:inline-block;border:3px solid var(--red);color:var(--red);
  padding:4px 16px;font-size:.85rem;font-family:var(--font-heading);
  transform:rotate(-5deg);margin-bottom:16px;opacity:.8;
}

/* ===== PHASE INDICATOR ===== */
.phase-bar{
  display:flex;gap:4px;margin-bottom:var(--gap);padding:12px 16px;
  background:#FFFEF7;border:1px solid rgba(139,69,19,.15);border-radius:var(--radius);
  align-items:center;flex-wrap:wrap;
}
.phase-bar .phase-item{
  padding:6px 14px;font-size:.85rem;font-family:var(--font-heading);
  border-radius:var(--radius);color:var(--muted);border:1px solid transparent;
  transition:all var(--transition);
}
.phase-bar .phase-item.current{
  background:var(--brown);color:var(--bg);border-color:var(--brown);
}
.phase-bar .phase-item.completed{
  background:rgba(46,139,87,.15);color:var(--green);border-color:var(--green);
}
.phase-bar .phase-item.locked{opacity:.4}
.phase-bar .progress-text{margin-left:auto;font-size:.8rem;color:var(--muted)}

/* ===== MAP ===== */
.map-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:var(--gap)}
.map-card{
  cursor:pointer;padding:20px;position:relative;overflow:hidden;
  transition:all var(--transition);
}
.map-card:hover{transform:translateY(-2px)}
.map-card.locked{opacity:.45;cursor:not-allowed;pointer-events:none}
.map-card .scene-type{
  font-size:.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);
  margin-bottom:4px;
}
.map-card .scene-name{font-family:var(--font-heading);font-size:1.1rem;color:var(--brown);margin-bottom:6px}
.map-card .scene-desc{font-size:.85rem;color:var(--muted);line-height:1.5}
.map-card .clue-count{
  position:absolute;top:12px;right:12px;
  background:var(--brown);color:var(--bg);font-size:.7rem;
  padding:2px 8px;border-radius:var(--radius);font-family:var(--font-heading);
}

/* ===== CHARACTER LIST ===== */
.char-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:var(--gap)}
.char-card{
  cursor:pointer;padding:16px;text-align:center;transition:all var(--transition);
}
.char-card:hover{transform:translateY(-2px)}
.char-card.locked{opacity:.35;pointer-events:none}
.char-card .silhouette{
  width:64px;height:64px;margin:0 auto 8px;border-radius:50%;
  background:var(--ink);display:flex;align-items:center;justify-content:center;
  color:var(--bg);font-size:1.4rem;font-family:var(--font-heading);
  border:2px solid var(--brown);
}
.char-card .char-name{font-size:.9rem;font-family:var(--font-heading);color:var(--brown)}
.char-card .char-role{font-size:.75rem;color:var(--muted)}
.char-card .lie-indicator{color:var(--red);font-size:.7rem;margin-top:4px}

/* ===== ACTION BAR ===== */
.action-bar{
  display:flex;gap:8px;margin:var(--gap) 0;flex-wrap:wrap;justify-content:center;
}

/* ===== SCENE VIEW ===== */
.scene-header{
  padding:24px;background:linear-gradient(135deg,#FFFEF7,#F5F0E0);
  border:1px solid rgba(139,69,19,.2);border-radius:var(--radius);margin-bottom:var(--gap);
}
.scene-header .scene-type-label{font-size:.75rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.scene-header h2{margin:4px 0 8px}
.scene-detail{font-size:.95rem;line-height:1.8;margin-top:12px;padding-top:12px;border-top:1px dashed rgba(139,69,19,.2)}
.search-areas{margin-top:var(--gap)}
.search-area{
  padding:16px 20px;cursor:pointer;border:1px dashed var(--brown);
  background:rgba(139,69,19,.03);margin-bottom:8px;border-radius:var(--radius);
  transition:all var(--transition);display:flex;align-items:center;gap:12px;
}
.search-area:hover{background:rgba(139,69,19,.08);border-style:solid}
.search-area.searched{border-color:var(--green);background:rgba(46,139,87,.05);cursor:default}
.search-area .search-icon{font-size:1.3rem;flex-shrink:0}
.search-area .search-info h4{margin-bottom:2px}
.search-area .search-info .hint-text{font-size:.85rem;color:var(--muted)}
.search-area.phase-locked{opacity:.4;cursor:not-allowed;border-color:var(--muted)}
.collected-clues{margin-top:var(--gap)}
.mini-clue{
  padding:10px 14px;background:rgba(139,69,19,.06);border-left:3px solid var(--brown);
  margin-bottom:6px;border-radius:0 var(--radius) var(--radius) 0;
  font-size:.9rem;animation:slideIn .3s both;
}
.mini-clue.new{animation:stampIn .5s both;border-left-color:var(--green)}

/* ===== DIALOGUE VIEW ===== */
.dialogue-container{max-width:700px;margin:0 auto}
.char-profile{
  display:flex;gap:20px;align-items:flex-start;padding:20px;
  background:#FFFEF7;border:1px solid rgba(139,69,19,.15);
  border-radius:var(--radius);margin-bottom:var(--gap);
}
.char-profile .avatar{
  width:80px;height:80px;border-radius:50%;background:var(--ink);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:var(--bg);
  font-size:2rem;font-family:var(--font-heading);border:3px solid var(--brown);
}
.char-profile .char-info h3{margin-bottom:4px}
.char-profile .char-bg{font-size:.85rem;color:var(--muted);line-height:1.5}
.dialogue-log{
  max-height:360px;overflow-y:auto;padding:16px;
  background:#FFFEF7;border:1px solid rgba(139,69,19,.12);
  border-radius:var(--radius);margin-bottom:12px;
}
.dialogue-log::-webkit-scrollbar{width:6px}
.dialogue-log::-webkit-scrollbar-thumb{background:rgba(139,69,19,.2);border-radius:3px}
.msg{padding:10px 14px;margin-bottom:8px;border-radius:var(--radius);animation:flipIn .3s both;max-width:85%}
.msg.player{background:rgba(139,69,19,.1);margin-left:auto;text-align:right}
.msg.char{background:rgba(46,139,87,.08);border-left:3px solid var(--green)}
.msg.system{background:rgba(178,34,34,.08);border-left:3px solid var(--red);font-size:.85rem;font-style:italic}
.msg .speaker{font-size:.75rem;font-family:var(--font-heading);color:var(--brown);margin-bottom:2px}
.msg .text{font-size:.9rem;line-height:1.6}
.topic-buttons{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.topic-btn{
  padding:6px 12px;font-size:.82rem;border:1px solid var(--brown);
  background:rgba(139,69,19,.05);color:var(--brown);cursor:pointer;
  border-radius:var(--radius);font-family:var(--font-body);
  transition:all var(--transition);
}
.topic-btn:hover{background:var(--brown);color:var(--bg)}
.topic-btn.exhausted{opacity:.35;cursor:not-allowed;pointer-events:none;text-decoration:line-through}
.dialogue-input{
  display:flex;gap:8px;margin-bottom:12px;
}
.dialogue-input input{
  flex:1;padding:10px 14px;border:1px solid rgba(139,69,19,.3);
  background:#FFFEF7;font-family:var(--font-body);font-size:.9rem;
  border-radius:var(--radius);color:var(--ink);
  transition:border-color var(--transition);
}
.dialogue-input input:focus{outline:none;border-color:var(--brown)}
.challenge-section{
  margin-top:12px;padding:16px;border:2px dashed var(--red);
  background:rgba(178,34,34,.03);border-radius:var(--radius);
}
.challenge-section h4{color:var(--red);margin-bottom:8px}
.challenge-clue-list{display:flex;flex-wrap:wrap;gap:6px}
.challenge-clue-btn{
  padding:5px 10px;font-size:.8rem;border:1px solid var(--muted);
  background:#FFFEF7;cursor:pointer;border-radius:var(--radius);
  transition:all var(--transition);
}
.challenge-clue-btn:hover{border-color:var(--red);color:var(--red)}
.recommendations{
  margin-top:12px;padding:12px 16px;
  background:rgba(139,69,19,.04);border:1px solid rgba(139,69,19,.1);
  border-radius:var(--radius);
}
.recommendations h4{font-size:.85rem;margin-bottom:6px;color:var(--brown)}
.recommendations ul{list-style:none;padding:0}
.recommendations li{font-size:.82rem;color:var(--muted);padding:2px 0}
.recommendations li::before{content:">> ";color:var(--brown)}

/* ===== CLUE BOARD ===== */
.clue-board{
  background:linear-gradient(135deg,#B8860B22,#8B451322);
  border:8px solid #6B3410;border-radius:4px;padding:var(--card-pad);
  min-height:400px;position:relative;
  box-shadow:inset 0 0 30px rgba(0,0,0,.1),3px 5px 15px rgba(0,0,0,.15);
}
.clue-board::before{
  content:'';position:absolute;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.06'/%3E%3C/svg%3E");
  pointer-events:none;
}
.clue-filters{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;position:relative;z-index:1}
.clue-filter-btn{
  padding:5px 12px;font-size:.8rem;border:1px solid rgba(139,69,19,.4);
  background:rgba(255,254,247,.7);cursor:pointer;border-radius:var(--radius);
  font-family:var(--font-heading);transition:all var(--transition);
}
.clue-filter-btn.active{background:var(--brown);color:var(--bg)}
.clue-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;position:relative;z-index:1}
.clue-pin{
  background:#FFFEF7;padding:14px;border-radius:var(--radius);position:relative;
  box-shadow:1px 2px 8px rgba(0,0,0,.1);cursor:pointer;
  transition:all var(--transition);transform:rotate(calc(var(--rot,0) * 1deg));
  border-top:3px solid var(--brown);
}
.clue-pin::before{
  content:'';position:absolute;top:-6px;left:50%;transform:translateX(-50%);
  width:12px;height:12px;border-radius:50%;
  background:radial-gradient(circle,#C0392B,#922B21);
  box-shadow:0 1px 3px rgba(0,0,0,.3);
}
.clue-pin:hover{transform:rotate(0deg) scale(1.03);z-index:2}
.clue-pin .clue-name{font-family:var(--font-heading);font-size:.9rem;color:var(--brown);margin-top:4px;margin-bottom:4px}
.clue-pin .clue-desc{font-size:.8rem;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.clue-pin .clue-phase-tag{position:absolute;top:8px;right:8px}

/* clue detail overlay */
.clue-detail-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;
  display:none;align-items:center;justify-content:center;padding:16px;
}
.clue-detail-overlay.active{display:flex}
.clue-detail-card{
  background:#FFFEF7;max-width:500px;width:100%;padding:32px;
  border-radius:var(--radius);border-top:4px solid var(--brown);
  box-shadow:0 8px 32px rgba(0,0,0,.2);animation:flipIn .3s both;
  position:relative;
}
.clue-detail-card .close-btn{
  position:absolute;top:12px;right:16px;background:none;border:none;
  font-size:1.5rem;cursor:pointer;color:var(--muted);
}
.clue-detail-card h3{margin-bottom:12px}
.clue-detail-card .detail-desc{font-size:.95rem;line-height:1.8;margin-bottom:12px}
.clue-detail-card .detail-extra{font-size:.85rem;color:var(--muted);padding-top:12px;border-top:1px dashed rgba(139,69,19,.2);line-height:1.6}

/* ===== REPORT ===== */
.report-card{max-width:700px;margin:0 auto}
.question-block{
  padding:20px;margin-bottom:16px;background:#FFFEF7;
  border:1px solid rgba(139,69,19,.15);border-radius:var(--radius);
}
.question-block .q-num{font-size:.75rem;color:var(--muted);margin-bottom:4px}
.question-block .q-text{font-family:var(--font-heading);font-size:1rem;margin-bottom:12px;line-height:1.6}
.question-block label{
  display:block;padding:8px 12px;margin-bottom:4px;cursor:pointer;
  border:1px solid transparent;border-radius:var(--radius);
  font-size:.9rem;transition:all var(--transition);
}
.question-block label:hover{background:rgba(139,69,19,.05);border-color:rgba(139,69,19,.1)}
.question-block label.selected{background:rgba(139,69,19,.1);border-color:var(--brown)}
.question-block label.correct{background:rgba(46,139,87,.12);border-color:var(--green);color:var(--green)}
.question-block label.wrong{background:rgba(178,34,34,.1);border-color:var(--red);color:var(--red)}
.question-block input[type="radio"]{margin-right:8px;accent-color:var(--brown)}
.report-result{
  text-align:center;padding:32px;animation:stampIn .6s both;
}
.report-result .score{font-size:3rem;font-family:var(--font-heading);color:var(--brown)}
.report-result .grade{font-size:1.5rem;margin:8px 0;font-family:var(--font-heading)}

/* ===== HINTS PANEL ===== */
.hints-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;
  display:none;align-items:flex-start;justify-content:center;padding:40px 16px;
  overflow-y:auto;
}
.hints-overlay.active{display:flex}
.hints-panel{
  background:#FFFEF7;max-width:600px;width:100%;padding:32px;
  border-radius:var(--radius);border-top:4px solid var(--brown);
  box-shadow:0 8px 32px rgba(0,0,0,.2);animation:slideIn .3s both;
  position:relative;
}
.hints-panel .close-btn{position:absolute;top:12px;right:16px;background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--muted)}
.hint-phase-group{margin-bottom:20px}
.hint-phase-group h4{margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid rgba(139,69,19,.15)}
.hint-tier{
  padding:10px 14px;margin-bottom:6px;border-left:3px solid var(--muted);
  background:rgba(139,69,19,.03);border-radius:0 var(--radius) var(--radius) 0;
}
.hint-tier .hint-cost{font-size:.75rem;color:var(--red);margin-bottom:4px}
.hint-tier .hint-text{font-size:.9rem;line-height:1.5;display:none}
.hint-tier .hint-text.revealed{display:block}
.hint-tier .reveal-btn{
  padding:4px 10px;font-size:.8rem;border:1px solid var(--muted);
  background:transparent;cursor:pointer;border-radius:var(--radius);
  color:var(--muted);transition:all var(--transition);
}
.hint-tier .reveal-btn:hover{border-color:var(--red);color:var(--red)}
.hint-tier .reveal-btn.used{display:none}

/* ===== PHASE TRANSITION ===== */
.phase-transition-overlay{
  position:fixed;inset:0;background:rgba(47,47,47,.85);z-index:200;
  display:none;align-items:center;justify-content:center;
}
.phase-transition-overlay.active{display:flex}
.phase-transition-content{
  text-align:center;color:var(--bg);animation:slideIn .5s both;max-width:500px;padding:24px;
}
.phase-transition-content h2{color:#F5F5DC;font-size:2rem;margin-bottom:16px;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.phase-transition-content p{font-size:1rem;line-height:1.8;margin-bottom:24px;opacity:.9}
.phase-transition-content .stamp-mark{
  display:inline-block;border:3px solid var(--green);color:var(--green);
  padding:8px 24px;font-size:1.2rem;font-family:var(--font-heading);
  animation:stampIn .6s .3s both;transform:rotate(-5deg);
}

/* ===== BACK BUTTON ===== */
.back-btn{
  display:inline-flex;align-items:center;gap:6px;padding:8px 16px;
  border:1px solid rgba(139,69,19,.3);background:rgba(139,69,19,.05);
  color:var(--brown);cursor:pointer;border-radius:var(--radius);
  font-family:var(--font-heading);font-size:.85rem;
  margin-bottom:var(--gap);transition:all var(--transition);
}
.back-btn:hover{background:rgba(139,69,19,.12)}
.back-btn::before{content:"<< "}

/* ===== SCORE DISPLAY ===== */
.score-display{
  position:fixed;top:12px;right:12px;z-index:50;
  padding:8px 16px;background:#FFFEF7;border:1px solid rgba(139,69,19,.2);
  border-radius:var(--radius);font-family:var(--font-heading);font-size:.85rem;
  box-shadow:1px 2px 6px rgba(0,0,0,.08);
}

// ========================================
// AUDIO ENGINE (Web Audio API)
// ========================================

let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playPageFlip() {
  try {
    const ctx = getAudioCtx();
    const buf = ctx.createBuffer(1, ctx.sampleRate * 0.15, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.04)) * 0.3;
    }
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const filt = ctx.createBiquadFilter();
    filt.type = 'highpass'; filt.frequency.value = 2000;
    src.connect(filt); filt.connect(ctx.destination);
    src.start();
  } catch(e) {}
}

function playPenWrite() {
  try {
    const ctx = getAudioCtx();
    const dur = 0.08;
    const buf = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      const t = i / ctx.sampleRate;
      data[i] = (Math.random() * 2 - 1) * 0.1 * Math.sin(t * 3000) * Math.exp(-t * 30);
    }
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);
    src.start();
  } catch(e) {}
}

function playStamp() {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(150, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.15);
    // noise thud
    const buf = ctx.createBuffer(1, ctx.sampleRate * 0.1, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.02)) * 0.3;
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);
    src.start();
  } catch(e) {}
}

function playSuccess() {
  try {
    const ctx = getAudioCtx();
    [440, 554, 659].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine'; osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, ctx.currentTime + i * 0.12);
      gain.gain.linearRampToValueAtTime(0.15, ctx.currentTime + i * 0.12 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.12 + 0.3);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(ctx.currentTime + i * 0.12);
      osc.stop(ctx.currentTime + i * 0.12 + 0.3);
    });
  } catch(e) {}
}

function showView(viewId) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  const view = document.getElementById(viewId);
  if (view) {
    view.classList.add('active');
    view.style.animation = 'none';
    view.offsetHeight; // reflow
    view.style.animation = '';
  }
  playPageFlip();
  if (viewId === 'mainDesk') renderMainDesk();
  if (viewId === 'clueBoard') renderClueBoard();
  if (viewId === 'report') renderReport();
  document.getElementById('scoreDisplay').style.display = viewId === 'startScreen' ? 'none' : 'block';
  updateScoreDisplay();
}

function updateScoreDisplay() {
  document.getElementById('scoreVal').textContent = state.score;
}

// ========================================
// PHASE LOGIC
// ========================================

function getCurrentPhaseObj() {
  return PHASES.find(p => p.id === state.currentPhase);
}

function getPhaseOrder(phaseId) {
  const p = PHASES.find(pp => pp.id === phaseId);
  return p ? p.order : 99;
}

function isPhaseUnlocked(phaseId) {
  return getPhaseOrder(phaseId) <= getPhaseOrder(state.currentPhase);
}

function getAvailableSceneIds() {
  let ids = [];
  PHASES.forEach(p => {
    if (isPhaseUnlocked(p.id)) ids = ids.concat(p.scenes);
  });
  return ids;
}

function getAvailableCharIds() {
  let ids = new Set();
  PHASES.forEach(p => {
    if (isPhaseUnlocked(p.id)) p.characters.forEach(c => ids.add(c));
  });
  // Also include chars whose phases include the current phase
  CHARACTERS.forEach(c => {
    if (c.phases.includes(state.currentPhase) || c.phases.some(pp => isPhaseUnlocked(pp))) {
      ids.add(c.id);
    }
  });
  return [...ids];
}

function checkPhaseAdvance() {
  const phase = getCurrentPhaseObj();
  if (!phase || !phase.advanceClues) return;
  const allCollected = phase.advanceClues.every(c => state.collectedClues.includes(c));
  if (allCollected) {
    const nextIdx = PHASES.indexOf(phase) + 1;
    if (nextIdx < PHASES.length) {
      const nextPhase = PHASES[nextIdx];
      state.currentPhase = nextPhase.id;
      showPhaseTransition(nextPhase);
    }
  }
}

function showPhaseTransition(phase) {
  const overlay = document.getElementById('phaseTransition');
  const content = document.getElementById('phaseTransitionContent');
  content.innerHTML = `
    <h2>阶段推进</h2>
    <div class="stamp-mark">第${phase.order}阶段</div>
    <h2 style="margin-top:16px">${phase.name}</h2>
    <p>${phase.briefing}</p>
    <button class="btn primary" onclick="closePhaseTransition()" style="color:#F5F5DC;border-color:#F5F5DC">继续调查</button>
  `;
  overlay.classList.add('active');
  playSuccess();
}

function closePhaseTransition() {
  document.getElementById('phaseTransition').classList.remove('active');
  renderMainDesk();
}

// ========================================
// CLUE COLLECTION
// ========================================

function collectClue(clueId, silent) {
  if (state.collectedClues.includes(clueId)) return false;
  state.collectedClues.push(clueId);
  if (!silent) {
    playPenWrite();
    const clue = CLUES.find(c => c.id === clueId);
    if (clue) showToast(`发现线索: ${clue.name}`);
  }
  checkPhaseAdvance();
  return true;
}

function hasClue(clueId) {
  return state.collectedClues.includes(clueId);
}

  const toast = document.createElement('div');
  toast.style.cssText = `
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:300;
    padding:12px 24px;background:#FFFEF7;border:2px solid var(--brown);
    border-radius:2px;font-family:var(--font-heading);font-size:.9rem;color:var(--brown);
    box-shadow:2px 4px 12px rgba(0,0,0,.15);animation:slideIn .3s both;
    max-width:90vw;text-align:center;
  `;
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => {
    toast.style.transition = 'opacity .3s';
    toast.style.opacity = '0';
    setTimeout(() => toast.remove(), 300);
  }, 2500);
}

function renderMainDesk() {
  renderPhaseBar();
  renderMap();
  renderCharGrid();

  const reportBtn = document.getElementById('reportBtn');
  if (state.currentPhase === 'phase_03') {

  }

function renderPhaseBar() {
  const bar = document.getElementById('phaseBar');
  const totalClues = CLUES.length;
  const collected = state.collectedClues.length;
  bar.innerHTML = PHASES.map(p => {
    let cls = 'phase-item';
    if (p.id === state.currentPhase) cls += ' current';
    else if (getPhaseOrder(p.id) < getPhaseOrder(state.currentPhase)) cls += ' completed';
    else cls += ' locked';
    return `<div class="${cls}">第${p.order}阶段: ${p.name}</div>`;
  }).join('') + `<div class="progress-text">已收集 ${collected}/${totalClues} 条线索</div>`;
}

function renderMap() {
  const grid = document.getElementById('mapGrid');
  const available = getAvailableSceneIds();
  grid.innerHTML = SCENES.map(s => {
    const unlocked = available.includes(s.id);
    const visited = state.visitedScenes.includes(s.id);
    const totalClues = s.publicClues.length + s.hiddenClues.length;
    const foundHere = [...s.publicClues, ...s.hiddenClues].filter(c => hasClue(c)).length;
    return `
      <div class="card map-card ${unlocked ? '' : 'locked'}" onclick="${unlocked ? `openScene('${s.id}')` : ''}">
        <div class="scene-type">${s.type}</div>
        <div class="scene-name">${s.name} ${visited ? '<span style="color:var(--green);font-size:.8rem">已访问</span>' : ''}</div>
        <div class="scene-desc">${s.desc}</div>
        ${unlocked ? `<div class="clue-count">${foundHere}/${totalClues} 线索</div>` : '<div class="clue-count" style="background:var(--muted)">锁定</div>'}
      </div>
    `;
  }).join('');
}

function renderCharGrid() {
  const grid = document.getElementById('charGrid');
  const available = getAvailableCharIds();
  grid.innerHTML = CHARACTERS.map(c => {
    const unlocked = available.includes(c.id);
    const hasLie = c.lie && !state.challengesDone.includes(c.lie.id);
    const lied = c.lie && state.challengesDone.includes(c.lie.id);
    return `
      <div class="card char-card ${unlocked ? '' : 'locked'}" onclick="${unlocked ? `openDialogue('${c.id}')` : ''}">
        <div class="silhouette">${c.initial}</div>
        <div class="char-name">${c.name}</div>
        <div class="char-role">${c.role}</div>
        ${hasLie ? '<div class="lie-indicator">可能有所隐瞒</div>' : ''}
        ${lied ? '<div style="color:var(--green);font-size:.7rem;margin-top:4px">已揭露谎言</div>' : ''}
      </div>
    `;
  }).join('');
}

// ========================================
// SCENE VIEW
// ========================================

function openScene(sceneId) {
  const scene = SCENES.find(s => s.id === sceneId);
  if (!scene) return;
  state.currentScene = sceneId;

  // Auto-collect public clues on entry
  const newClues = [];
  scene.publicClues.forEach(cid => {
    if (collectClue(cid, true)) newClues.push(cid);
  });
  if (!state.visitedScenes.includes(sceneId)) state.visitedScenes.push(sceneId);

  renderSceneView(scene, newClues);
  showView('sceneView');
  if (newClues.length > 0) {
    setTimeout(() => showToast(`自动收集了 ${newClues.length} 条线索`), 400);
  }
}

function renderSceneView(scene, newClues) {
  const content = document.getElementById('sceneContent');
  const allClues = [...scene.publicClues, ...scene.hiddenClues].filter(c => hasClue(c));

  content.innerHTML = `
    <div class="scene-header">
      <div class="scene-type-label">${scene.type}</div>
      <h2>${scene.name}</h2>
      <p>${scene.desc}</p>
      <div class="scene-detail">${scene.detail}</div>
    </div>

    <div class="search-areas">
      <h3>可搜索区域</h3>
      ${scene.searchAreas.map(area => {
        const searched = state.searchedAreas.includes(sceneId + '_' + area.clue);
        const phaseLocked = area.requirePhase && !isPhaseUnlocked(area.requirePhase);
        let cls = 'search-area';
        if (searched) cls += ' searched';
        if (phaseLocked) cls += ' phase-locked';

        return `
          <div class="${cls}" onclick="${!searched && !phaseLocked ? `searchArea('${scene.id}','${area.clue}')` : ''}">
            <div class="search-icon">${searched ? '&#10003;' : phaseLocked ? '&#128274;' : '&#128269;'}</div>
            <div class="search-info">
              <h4>${area.name}</h4>
              <div class="hint-text">${phaseLocked ? '需要更深入的调查才能检查此处' : area.hint}</div>
            </div>
          </div>
        `;
      }).join('')}
    </div>

    <div class="collected-clues">
      <h3 style="margin-bottom:8px">已发现的线索</h3>
      ${allClues.length === 0 ? '<p class="muted" style="font-size:.9rem">暂无线索</p>' :
        allClues.map(cid => {
          const clue = CLUES.find(c => c.id === cid);
          const isNew = newClues && newClues.includes(cid);
          return `<div class="mini-clue ${isNew ? 'new' : ''}">${clue ? clue.name + ' - ' + clue.desc : cid}</div>`;
        }).join('')}
    </div>
  `;
}

function searchArea(sceneId, clueId) {
  const key = sceneId + '_' + clueId;
  if (state.searchedAreas.includes(key)) return;
  state.searchedAreas.push(key);
  collectClue(clueId, false);
  playStamp();

  const scene = SCENES.find(s => s.id === sceneId);
  if (scene) renderSceneView(scene, [clueId]);
}

let currentDialogueChar = null;

function openDialogue(charId) {
  const char = CHARACTERS.find(c => c.id === charId);
  if (!char) return;
  currentDialogueChar = char;
  state.currentChar = charId;
  state.dialogueLog = [];
  renderDialogueView(char);
  showView('dialogueView');
}

function renderDialogueView(char) {
  const content = document.getElementById('dialogueContent');
  const hasLie = char.lie && !state.challengesDone.includes(char.lie.id);
  const lied = char.lie && state.challengesDone.includes(char.lie.id);

  content.innerHTML = `
    <div class="char-profile">
      <div class="avatar">${char.initial}</div>
      <div class="char-info">
        <h3>${char.name}</h3>
        <div style="font-size:.8rem;color:var(--muted);margin-bottom:4px">${char.role} ${hasLie ? '<span style="color:var(--red)"> | 可能有所隐瞒</span>' : ''}${lied ? '<span style="color:var(--green)"> | 已揭露谎言</span>' : ''}</div>
        <div class="char-bg">${char.bg}</div>
      </div>
    </div>

    <div class="dialogue-log" id="dialogueLog">
      <div class="msg system"><div class="text">你开始与${char.name}交谈。选择话题关键词或输入文字来询问。</div></div>
    </div>

    <div class="topic-buttons" id="topicButtons">
      ${char.topics.map(t => {
        const usageKey = char.id + '_' + t.id;
        const used = state.topicUsage[usageKey] || 0;
        const exhausted = used >= t.maxUse;
        return t.keywords.map(kw =>
          `<button class="topic-btn ${exhausted ? 'exhausted' : ''}" onclick="askTopic('${char.id}','${t.id}','${kw}')" ${exhausted ? 'disabled' : ''}>${kw}</button>`
        ).join('');
      }).join('')}
    </div>

    <div class="dialogue-input">
      <input type="text" id="dialogueInput" placeholder="输入关键词询问..." onkeydown="if(event.key==='Enter')submitDialogue()">
      <button class="btn small" onclick="submitDialogue()">询问</button>
    </div>

    ${hasLie ? `
    <div class="challenge-section">
      <h4>质问 - 使用线索揭露谎言</h4>
      <p style="font-size:.85rem;color:var(--muted);margin-bottom:8px">${char.lie.about}</p>
      <div class="challenge-clue-list" id="challengeClues">
        ${state.collectedClues.map(cid => {
          const clue = CLUES.find(c => c.id === cid);
          return clue ? `<button class="challenge-clue-btn" onclick="challengeWith('${char.id}','${cid}')">${clue.name}</button>` : '';
        }).join('')}
        ${state.collectedClues.length === 0 ? '<p class="muted" style="font-size:.85rem">尚未收集到任何线索</p>' : ''}
      </div>
    </div>
    ` : ''}

      <h4>调查建议</h4>
      <ul id="recList"></ul>
    </div>
  `;
}

function askTopic(charId, topicId, keyword) {
  const char = CHARACTERS.find(c => c.id === charId);
  if (!char) return;
  const topic = char.topics.find(t => t.id === topicId);
  if (!topic) return;

  const usageKey = charId + '_' + topicId;
  const used = state.topicUsage[usageKey] || 0;

  if (used >= topic.maxUse) {
    addDialogueMsg('char', char.name, '关于这件事，我已经说过了。没有更多可以补充的。');
    return;
  }

  state.topicUsage[usageKey] = used + 1;
  addDialogueMsg('player', '侦探', `关于"${keyword}"...`);
  setTimeout(() => {
    addDialogueMsg('char', char.name, topic.response);
    playPenWrite();
    showRecommendations(char);
    renderTopicButtons(char);
  }, 300);
}

function submitDialogue() {
  const input = document.getElementById('dialogueInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';

  const char = currentDialogueChar;
  if (!char) return;

  // Match keywords
  let matched = null;
  for (const topic of char.topics) {
    const usageKey = char.id + '_' + topic.id;
    const used = state.topicUsage[usageKey] || 0;
    if (used >= topic.maxUse) continue;
    for (const kw of topic.keywords) {
      if (text.includes(kw)) {
        matched = { topic, keyword: kw };
        break;
      }
    }
    if (matched) break;
  }

  addDialogueMsg('player', '侦探', text);

  if (matched) {
    const usageKey = char.id + '_' + matched.topic.id;
    state.topicUsage[usageKey] = (state.topicUsage[usageKey] || 0) + 1;
    setTimeout(() => {
      addDialogueMsg('char', char.name, matched.topic.response);
      playPenWrite();
      showRecommendations(char);
      renderTopicButtons(char);
    }, 300);
  } else {
    setTimeout(() => {
      addDialogueMsg('char', char.name, '（沉默片刻）我不确定该怎么回答这个问题。也许您可以换个方式问？');
    }, 300);
  }
}

function renderTopicButtons(char) {
  const container = document.getElementById('topicButtons');
  if (!container) return;
  container.innerHTML = char.topics.map(t => {
    const usageKey = char.id + '_' + t.id;
    const used = state.topicUsage[usageKey] || 0;
    const exhausted = used >= t.maxUse;
    return t.keywords.map(kw =>
      `<button class="topic-btn ${exhausted ? 'exhausted' : ''}" onclick="askTopic('${char.id}','${t.id}','${kw}')" ${exhausted ? 'disabled' : ''}>${kw}</button>`
    ).join('');
  }).join('');
}

function addDialogueMsg(type, speaker, text) {
  const log = document.getElementById('dialogueLog');
  if (!log) return;
  const div = document.createElement('div');
  div.className = `msg ${type}`;
  div.innerHTML = `<div class="speaker">${speaker}</div><div class="text">${text}</div>`;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  state.dialogueLog.push({ type, speaker, text });
}

function challengeWith(charId, clueId) {
  const char = CHARACTERS.find(c => c.id === charId);
  if (!char || !char.lie) return;

  if (state.challengesDone.includes(char.lie.id)) return;

  addDialogueMsg('player', '侦探', `我要用证据质问你——${CLUES.find(c=>c.id===clueId)?.name || clueId}`);

  if (clueId === char.lie.challengeClue) {
    // Success
    state.challengesDone.push(char.lie.id);
    state.challengeSuccesses++;
    state.score += 10;
    setTimeout(() => {
      addDialogueMsg('char', char.name, char.lie.successText);
      if (char.lie.rewardClue) collectClue(char.lie.rewardClue, false);
      playSuccess();
      showToast('质问成功！+10分');
      updateScoreDisplay();
      renderDialogueView(char);
      // Rebuild the log
      state.dialogueLog.forEach(entry => {
        const log = document.getElementById('dialogueLog');
        const div = document.createElement('div');
        div.className = `msg ${entry.type}`;
        div.innerHTML = `<div class="speaker">${entry.speaker}</div><div class="text">${entry.text}</div>`;
        log.appendChild(div);
      });
    }, 500);
  } else {
    // Fail
    setTimeout(() => {
      addDialogueMsg('char', char.name, char.lie.failText);
      addDialogueMsg('system', '系统', '质问失败。证据不充分。你可以继续寻找正确的证据再试。');
    }, 500);
  }
}

function showRecommendations(char) {
  const recDiv = document.getElementById('recommendations');
  const recList = document.getElementById('recList');
  if (!recDiv || !recList) return;

  const recs = [];

  // Based on collected clues, suggest next steps
  if (hasClue('clue_footprints') && !hasClue('clue_hound_prints')) {
    recs.push('紫杉大道的泥泞路面可能隐藏着更多脚印痕迹');
  }
  if (hasClue('clue_cigar_ash') && !hasClue('clue_lyons_letter')) {
    recs.push('查尔斯爵士在等谁？调查是否有人约他到边门');
  }
  if (char.lie && !state.challengesDone.includes(char.lie.id)) {
    if (hasClue(char.lie.challengeClue)) {
      recs.push(`你手中的证据可以用来质问${char.name}的谎言`);
    } else {
      recs.push(`${char.name}似乎有所隐瞒，但你还需要找到合适的证据`);
    }
  }
  if (hasClue('clue_candle_signal') && !state.challengesDone.includes('lie_barrymore')) {
    recs.push('可以用烛光信号的证据质问白瑞摩');
  }
  if (hasClue('clue_selden_escape') && !hasClue('clue_henry_clothes')) {
    recs.push('了解塞尔登穿的衣服来源可能很重要');
  }
  if (hasClue('clue_mysterious_figure') && !hasClue('clue_hideout_note')) {
    recs.push('荒原石屋中可能藏有关于神秘人影的线索');
  }
  if (hasClue('clue_wife_not_sister') && !hasClue('clue_portrait_resemblance')) {
    recs.push('仔细研究巴斯克维尔庄园的肖像画可能会有惊人发现');
  }

  // Add generic tips
  if (recs.length === 0) {
    const phase = getCurrentPhaseObj();
    if (phase && phase.advanceClues) {
      const missing = phase.advanceClues.filter(c => !hasClue(c));
      if (missing.length > 0) {
        recs.push(`还需要收集 ${missing.length} 条关键线索才能推进调查`);
      }
    }
    recs.push('继续搜索各个地点并与相关人物交谈');
  }

  recList.innerHTML = recs.map(r => `<li>${r}</li>`).join('');
  recDiv.style.display = 'block';
}

function renderClueBoard() {
  const board = document.getElementById('clueBoardContent');
  const collected = state.collectedClues;

  if (collected.length === 0) {
    board.innerHTML = '<div class="empty-state">尚未收集到任何线索。<br>前往各个地点开始调查吧。</div>';
    return;
  }

  let filterHtml = `
    <div class="clue-filters">
      <button class="clue-filter-btn active" onclick="filterClues('all',this)">全部</button>
      <button class="clue-filter-btn" onclick="filterClues('phase_01',this)">第一阶段</button>
      <button class="clue-filter-btn" onclick="filterClues('phase_02',this)">第二阶段</button>
      <button class="clue-filter-btn" onclick="filterClues('phase_03',this)">第三阶段</button>
    </div>
  `;

  const clueCards = collected.map((cid, idx) => {
    const clue = CLUES.find(c => c.id === cid);
    if (!clue) return '';
    const rot = ((idx * 7 + 3) % 7) - 3;
    const phaseNum = clue.phase.replace('phase_0','');
    const badgeCls = 'phase' + phaseNum;
    return `
      <div class="clue-pin" style="--rot:${rot}" data-phase="${clue.phase}" onclick="showClueDetail('${cid}')">
        <span class="clue-phase-tag"><span class="badge ${badgeCls}">P${phaseNum}</span></span>
        <div class="clue-name">${clue.name}</div>
        <div class="clue-desc">${clue.desc}</div>
        ${clue.key ? '<span class="badge key" style="margin-top:6px">关键</span>' : ''}
        ${clue.hidden ? '<span class="badge hidden-badge" style="margin-top:6px">隐藏</span>' : ''}
      </div>
    `;
  }).join('');

  board.innerHTML = filterHtml + `<div class="clue-grid" id="clueGrid">${clueCards}</div>`;
}

function filterClues(phase, btn) {
  document.querySelectorAll('.clue-filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.clue-pin').forEach(pin => {
    if (phase === 'all' || pin.dataset.phase === phase) {
      pin.style.display = '';
    } else {
      pin.style.display = 'none';
    }
  });
}

function showClueDetail(clueId) {

  const overlay = document.getElementById('clueDetailOverlay');

function renderReport() {
  const content = document.getElementById('reportContent');

  if (state.reportSubmitted) {
    renderReportResult(content);
    return;
  }

  if (state.currentPhase !== 'phase_03') {
    content.innerHTML = '<div class="empty-state">需要达到第三阶段才能提交报告。</div>';
    return;
  }

  content.innerHTML = REPORT_QUESTIONS.map((q, idx) => `
    <div class="question-block" id="qblock_${q.id}">
      <div class="q-num">问题 ${idx + 1}/${REPORT_QUESTIONS.length}</div>
      <div class="q-text">${q.text}</div>
      ${q.options.map((opt, oi) => `
        <label onclick="selectAnswer('${q.id}',${oi},this)">
          <input type="radio" name="${q.id}" value="${oi}"> ${opt}
        </label>
      `).join('')}
    </div>
  `).join('') + `
    <div style="text-align:center;margin-top:24px">
      <button class="btn primary" onclick="submitReport()" style="font-size:1.1rem;padding:14px 40px">提交报告</button>
    </div>
  `;
}

function selectAnswer(qId, optIdx, label) {
  const block = document.getElementById('qblock_' + qId);
  block.querySelectorAll('label').forEach(l => l.classList.remove('selected'));
  label.classList.add('selected');
  playPenWrite();
}

function submitReport() {
  let correct = 0;
  const answers = {};

  REPORT_QUESTIONS.forEach(q => {
    const selected = document.querySelector(`input[name="${q.id}"]:checked`);
    if (selected) {
      answers[q.id] = parseInt(selected.value);
      const block = document.getElementById('qblock_' + q.id);
      block.querySelectorAll('label').forEach((l, idx) => {
        if (idx === q.correct) l.classList.add('correct');
        else if (idx === parseInt(selected.value)) l.classList.add('wrong');
        l.style.pointerEvents = 'none';
      });
      if (parseInt(selected.value) === q.correct) correct++;
    }
  });

  // Calculate final score
  // Challenge bonuses already applied
  const allCluesCollected = state.collectedClues.length === CLUES.length;
  const noHints = state.hintsRevealed.length === 0;

  if (allCluesCollected) { state.score += 15; showToast('全部线索收集奖励 +15'); }
  if (noHints) { state.score += 20; showToast('无提示奖励 +20'); }

  state.reportSubmitted = true;
  state.reportScore = correct;

  playStamp();
  updateScoreDisplay();

  setTimeout(() => {
    const content = document.getElementById('reportContent');
    renderReportResult(content, correct, answers, allCluesCollected, noHints);
  }, 1000);
}

function renderReportResult(content, correct, answers, allCluesCollected, noHints) {
  if (correct === undefined) {
    correct = state.reportScore;
    allCluesCollected = state.collectedClues.length === CLUES.length;
    noHints = state.hintsRevealed.length === 0;
  }

  const total = REPORT_QUESTIONS.length;
  const pct = Math.round(correct / total * 100);
  let grade = '初级侦探';
  if (pct >= 90) grade = '大侦探';
  else if (pct >= 70) grade = '高级侦探';
  else if (pct >= 50) grade = '中级侦探';

  content.innerHTML = `
    <div class="report-result">
      <div class="score">${state.score}</div>
      <div style="font-size:1rem;color:var(--muted);margin-bottom:8px">最终得分</div>
      <div class="grade" style="color:${pct >= 70 ? 'var(--green)' : 'var(--red)'}">${grade}</div>
      <div style="margin:16px 0;font-size:.95rem">
        <p>答对 ${correct}/${total} 题</p>
        <p>质问成功 ${state.challengeSuccesses} 次 (+${state.challengeSuccesses * 10}分)</p>
        <p>收集线索 ${state.collectedClues.length}/${CLUES.length} 条</p>
        ${allCluesCollected ? '<p style="color:var(--green)">全部线索收集奖励 +15</p>' : ''}
        ${noHints ? '<p style="color:var(--green)">无提示奖励 +20</p>' : ''}
        ${state.hintsRevealed.length > 0 ? `<p style="color:var(--red)">使用提示 ${state.hintsRevealed.length} 次</p>` : ''}
      </div>
      <div style="margin-top:24px;padding:20px;border-top:2px solid var(--brown)">
        <h3 style="margin-bottom:12px">案件真相</h3>
        <p style="font-size:.95rem;line-height:1.8;text-align:left">
          杰克·斯台普顿实为罗杰·巴斯克维尔之子，是巴斯克维尔遗产的合法继承人。他利用家族猎犬传说，训练一只巨型猎犬并涂上磷光颜料，制造出"地狱猎犬"的恐怖效果。他利用劳拉·莱昂斯写信将查尔斯爵士引诱到紫杉大道边门等候，然后放出猎犬。查尔斯爵士因极度恐惧导致心脏衰竭而死。斯台普顿的下一个目标是亨利·巴斯克维尔爵士——他偷走亨利的旧靴子来训练猎犬追踪其气味。所谓的"妹妹"贝里尔实际上是他的妻子，被迫配合他的阴谋。
        </p>
      </div>
      <button class="btn" onclick="location.reload()" style="margin-top:20px">重新开始</button>
    </div>
  `;
}

function openHints() {
  const panel = document.getElementById('hintsPanel');

  panel.innerHTML = `
    <button class="close-btn" onclick="closeHints()">&times;</button>
    <h2 style="margin-bottom:4px">调查提示</h2>
    <p class="muted" style="font-size:.85rem;margin-bottom:20px">使用提示将永久扣除分数，且不可撤销。</p>
    ${HINTS.map((hGroup, gi) => {
      const phaseNum = hGroup.phase.replace('phase_0','');
      const phaseObj = PHASES.find(p => p.id === hGroup.phase);
      return `
        <div class="hint-phase-group">
          <h4>第${phaseNum}阶段: ${phaseObj ? phaseObj.name : ''}</h4>
          ${hGroup.tiers.map((tier, ti) => {
            const key = hGroup.phase + '_' + ti;
            const revealed = state.hintsRevealed.includes(key);
            // Can only reveal if previous tier is revealed (or it's tier 0)
            const canReveal = ti === 0 || state.hintsRevealed.includes(hGroup.phase + '_' + (ti - 1));
            return `
              <div class="hint-tier">
                <div class="hint-cost">提示 ${ti + 1} | 消耗 ${tier.cost} 分</div>
                ${revealed ?
                  `<div class="hint-text revealed">${tier.text}</div>` :
                  `<button class="reveal-btn ${!canReveal ? 'disabled' : ''}" ${!canReveal ? 'disabled' : ''} onclick="revealHint('${hGroup.phase}',${ti},${tier.cost})">
                    ${canReveal ? '查看提示 (-' + tier.cost + '分)' : '先查看前一级提示'}
                  </button>`
                }
              </div>
            `;
          }).join('')}
        </div>
      `;
    }).join('')}
  `;

  document.getElementById('hintsOverlay').classList.add('active');
}

function revealHint(phase, tierIdx, cost) {
  const key = phase + '_' + tierIdx;
  if (state.hintsRevealed.includes(key)) return;

  state.hintsRevealed.push(key);
  state.score -= cost;
  if (state.score < 0) state.score = 0;
  updateScoreDisplay();
  playPageFlip();
  showToast(`使用提示 -${cost}分`);
  openHints(); // re-render
}

function closeHints() {
  document.getElementById('hintsOverlay').classList.remove('active');
}
