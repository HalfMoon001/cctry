# ============================================
# Game3 - 攻略提示系统
# 3层渐进式揭露，每层扣分不可撤回
# ============================================

hints:
  # ========== 阶段 1 攻略 ==========
  phase1:
    - groupId: "hint-group-1-1"
      title: "查尔斯爵士之死的关键"
      levels:
        - level: 1
          penalty: -5
          text: "莫蒂默医生对你隐瞒了什么。仔细注意他描述现场时的犹豫和省略。"
        - level: 2
          penalty: -10
          text: "莫蒂默在陪审团前没有提到尸体附近的另一组足迹。试着用你掌握的证据去质疑他。"
        - level: 3
          penalty: -20
          text: "用'猎犬爪印证词'线索质疑莫蒂默。他会坦白：在距尸体二十码处发现了巨型猎犬的爪印。"

    - groupId: "hint-group-1-2"
      title: "红发会的真正目的"
      levels:
        - level: 1
          penalty: -5
          text: "想想谁从威尔逊每天离开当铺四小时中受益最大。关注助手的行为。"
        - level: 2
          penalty: -10
          text: "助手手上的酸液斑点和频繁进出地下室不是为了冲洗照片。检查当铺附近有什么重要建筑。"
        - level: 3
          penalty: -20
          text: "助手是约翰·克莱。他在当铺地下室挖掘隧道通往隔壁的城市与郊区银行金库。红发会是让威尔逊离开当铺的幌子。"

    - groupId: "hint-group-1-3"
      title: "初步线索收集方向"
      levels:
        - level: 1
          penalty: -5
          text: "贝克街的书桌和壁炉架上可能藏有重要信息。别忘了搜查红发会办公室。"
        - level: 2
          penalty: -10
          text: "书桌上有一份家族调查记录可作参考。壁炉架上有一则关键的新闻剪报。红发会办公室的抽屉和地板都值得检查。"
        - level: 3
          penalty: -20
          text: "壁炉架上的剪报提到银行存放了三万枚金币。红发会办公室地板有挖掘黏土的痕迹，抽屉有标注'J.C.'的账目。"

  # ========== 阶段 2 攻略 ==========
  phase2:
    - groupId: "hint-group-2-1"
      title: "巴里摩尔的秘密"
      levels:
        - level: 1
          penalty: -5
          text: "注意深夜庄园中的异常活动。有人在做不该做的事。"
        - level: 2
          penalty: -10
          text: "华生目击了巴里摩尔的蜡烛信号。用这个证据质疑他——他的秘密与逃犯有关，但与谋杀案无关。"
        - level: 3
          penalty: -20
          text: "巴里摩尔在向逃犯妻弟塞尔登发信号。质疑成功后他会供出关键信息：查尔斯爵士当晚在等一位女士——追查那封被烧毁的信件。"

    - groupId: "hint-group-2-2"
      title: "斯泰普尔顿的真面目"
      levels:
        - level: 1
          penalty: -5
          text: "斯泰普尔顿自称的'自然学家'身份经不起推敲。他的装备和能力都有疑点。"
        - level: 2
          penalty: -10
          text: "去庄园肖像画廊仔细看看巴斯克维尔家族的画像。试着把某幅画像与你见过的人对比。"
        - level: 3
          penalty: -20
          text: "遮住雨果·巴斯克维尔肖像的帽子和假发，你会发现他与斯泰普尔顿惊人相似。用这个证据质疑他——他是罗杰·巴斯克维尔之子。"

    - groupId: "hint-group-2-3"
      title: "庄园中的关键物证"
      levels:
        - level: 1
          penalty: -5
          text: "查尔斯爵士的书房和紫杉大道还有未被发现的重要证据。"
        - level: 2
          penalty: -10
          text: "书房壁炉的灰烬中有信件残片。紫杉大道上不只有一种雪茄灰。仆人住所也有线索。"
        - level: 3
          penalty: -20
          text: "信件残片显示有人约查尔斯爵士到边门赴约。第二种雪茄灰证明有人在监视。巴里摩尔太太深夜哭泣与逃犯弟弟有关。"

    - groupId: "hint-group-2-4"
      title: "亨利爵士的遭遇"
      levels:
        - level: 1
          penalty: -5
          text: "亨利在伦敦经历的几件怪事——警告信和失窃事件——都不是巧合。"
        - level: 2
          penalty: -10
          text: "注意失窃靴子的细节：新靴子被归还，旧靴子消失。凶手需要的不是靴子本身，而是靴子上的什么。"
        - level: 3
          penalty: -20
          text: "旧靴子有亨利的气味，猎犬需要气味来追踪目标。警告信来自斯泰普尔顿的妻子（他声称的'妹妹'），她试图警告亨利远离危险。"

  # ========== 阶段 3 攻略 ==========
  phase3:
    - groupId: "hint-group-3-1"
      title: "荒原据点的真相"
      levels:
        - level: 1
          penalty: -5
          text: "荒原上的石屋遗迹有人居住。搜查那里可能揭开监视网络的秘密。"
        - level: 2
          penalty: -10
          text: "石屋中的字条内容出乎意料——被监视的是华生而非亨利。那个'荒原神秘人'可能不是敌人。"
        - level: 3
          penalty: -20
          text: "石屋的居住者是福尔摩斯本人——他一直在暗中保护亨利并调查案件。字条是他的调查笔记。"

    - groupId: "hint-group-3-2"
      title: "格林盆泥潭的秘密"
      levels:
        - level: 1
          penalty: -5
          text: "斯泰普尔顿能穿越泥潭不是没有原因的。泥潭深处藏着案件的关键证据。"
        - level: 2
          penalty: -10
          text: "泥潭边缘有异常的化学物质残留。泥潭中心的小岛上有建筑物——需要先获得穿越泥潭的线索才能进入。"
        - level: 3
          penalty: -20
          text: "泥潭小岛上有犬舍——关过一只巨型猎犬。里面有磷光剂瓶和亨利丢失的旧靴子。这就是'地狱猎犬'的真相：涂满磷光剂的猎犬。"

    - groupId: "hint-group-3-3"
      title: "最终真相整合"
      levels:
        - level: 1
          penalty: -5
          text: "将三条线索链合并：猎犬谋杀、身份伪装、红发会骗局。它们揭示了不同层面的犯罪。"
        - level: 2
          penalty: -10
          text: "谋杀案：斯泰普尔顿是巴斯克维尔后裔 + 磷光猎犬 + 心脏病弱点。骗局：助手就是主谋 + 地下隧道 + 银行金库。"
        - level: 3
          penalty: -20
          text: "完整真相：斯泰普尔顿（杰克·巴斯克维尔）用磷光猎犬惊吓心脏病患者查尔斯爵士致死，目的是清除继承人夺取遗产。红发会骗局则是约翰·克莱利用威尔逊离店时间挖隧道抢银行。"
